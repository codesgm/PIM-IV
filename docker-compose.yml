services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pim-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"  # Apenas localhost, não exposto na rede
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - pim-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pim-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PimDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    ports:
      - "${HOST_IP}:5000:5000"
    depends_on:
      - sqlserver
    networks:
      - pim-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pim-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://api:5000
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    ports:
      - "${HOST_IP}:5028:8080"
    depends_on:
      - api
    networks:
      - pim-network

  faq:
    build:
      context: ./faq
      dockerfile: Dockerfile
    container_name: pim-faq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://api:5000
      - ProxySettings__BaseUrl=http://${HOST_IP}:9000
      - ASPNETCORE_URLS=http://0.0.0.0:8080
    ports:
      - "${HOST_IP}:5030:8080"
    depends_on:
      - api
    networks:
      - pim-network

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: pim-proxy
    environment:
      - BACKEND_API_URL=http://api:5000
      - BOT_IA_URL=http://bot-ia:8001
      - PROXY_PORT=9000
      - SESSION_TIMEOUT=3600
    ports:
      - "${HOST_IP}:9000:9000"
    depends_on:
      - api
      - bot-ia
    networks:
      - pim-network

  bot-ia:
    build:
      context: ./bot-ia
      dockerfile: Dockerfile
    container_name: pim-bot-ia
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - KNOWLEDGE_FILE_PATH=/app/knowledge/base_conhecimento.md
      - API_PORT=8001
      - LOG_LEVEL=INFO
      - MAX_TOKENS=1000
      - TEMPERATURE=0.7
    ports:
      - "${HOST_IP}:8001:8001"
    networks:
      - pim-network

volumes:
  sqlserver_data:

networks:
  pim-network:
    driver: bridge
